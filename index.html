<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>roadmap-tree</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">roadmap-tree</h1>
    <div class="progress" title="Share of leaf items marked done">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText"></span>
    </div>
    <nav class="tabs" aria-label="View">
      <button type="button" data-tab="tree" class="on">Tree</button>
      <button type="button" data-tab="calendar">Calendar</button>
    </nav>
    <div class="timer" id="timerChip" hidden>
      <span class="timer-dot"></span>
      <span id="timerLabel"></span>
      <span id="timerClock" class="timer-clock"></span>
      <button type="button" id="timerStop">Stop</button>
    </div>
    <div class="actions">
      <span id="treeActions">
        <button type="button" id="addRoot" title="Add a top-level item">+ Add item</button>
        <button type="button" id="expandAll">Expand all</button>
        <button type="button" id="collapseAll">Collapse all</button>
      </span>
      <span class="sep"></span>
      <button type="button" id="openBtn" title="Open a roadmap.json file">Open…</button>
      <button type="button" id="discardBtn" hidden title="Drop unsaved changes and reload from disk">Discard</button>
      <button type="button" id="saveBtn" class="primary" title="Save roadmap.json (Ctrl+S)">Save</button>
    </div>
  </header>

  <main class="layout">
    <section class="tree-wrap" id="treeWrap" aria-label="Roadmap tree">
      <div id="tree"></div>
      <p class="empty" id="emptyState" hidden>
        Nothing here yet. Click <strong>+ Add item</strong> to create your first
        item, and double-click the title above to rename this roadmap.
      </p>
      <p class="empty" id="loadError" hidden>
        Couldn't load <code>roadmap.json</code>. Serve this folder over HTTP
        (see README) or use <strong>Open…</strong> to pick the file.
      </p>
    </section>

    <section class="cal-wrap" id="calWrap" aria-label="Time calendar" hidden>
      <div class="cal-head">
        <button type="button" id="calPrev" aria-label="Previous month">‹</button>
        <h2 id="calTitle"></h2>
        <button type="button" id="calNext" aria-label="Next month">›</button>
        <button type="button" id="calToday">Today</button>
        <span class="cal-total" id="calTotal"></span>
      </div>
      <div class="cal-body">
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-day" id="calDay"></div>
      </div>
    </section>

    <aside class="next" aria-label="What's next">
      <h2>What's next</h2>
      <div id="nextList"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
