<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>roadmap-tree</title>
  <link rel="stylesheet" href="vendor/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="appbar">
    <span class="app-name">Roadmap Tree</span>
    <span class="app-ver" id="appVer"></span>
    <button type="button" class="link" id="checkUpdate" hidden>Check for updates</button>
    <button type="button" class="link" id="whatsNewBtn">What's new</button>
    <button type="button" class="link" id="aquariumBtn" title="Open the aquarium">Aquarium</button>
  </div>
  <nav class="projects" id="projectTabs" aria-label="Projects"></nav>
  <header class="topbar">
    <h1 id="title">roadmap-tree</h1>
    <div class="progress" title="Share of leaf items marked done">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText"></span>
    </div>
    <nav class="tabs" aria-label="View">
      <button type="button" data-tab="tree" class="on">Tree</button>
      <button type="button" data-tab="calendar">Calendar</button>
    </nav>
    <div class="actions">
      <span id="treeActions">
        <button type="button" id="addRoot" title="Add a main (top-level) step">+ Add main step</button>
        <button type="button" id="expandAll">Expand all</button>
        <button type="button" id="collapseAll">Collapse all</button>
      </span>
      <span class="sep"></span>
      <button type="button" id="importBtn" title="Add a project from a .json file">Import…</button>
      <button type="button" id="saveAsBtn" title="Save this project as a .json file you can open elsewhere">Save as…</button>
      <button type="button" id="discardBtn" hidden title="Drop unsaved changes and reload from disk">Discard</button>
      <button type="button" id="saveBtn" class="primary" title="Save roadmap.json (Ctrl+S)">Save</button>
    </div>
  </header>

  <main class="layout" id="mainLayout">
    <section class="tree-wrap" id="treeWrap" aria-label="Roadmap tree">
      <div id="tree"></div>
      <p class="empty" id="emptyState" hidden>
        Nothing here yet. Click <strong>+ Add main step</strong> to create your
        first step, and double-click the title above to rename this roadmap.
      </p>
      <button type="button" class="add-main" id="addRootBottom">+ Add main step</button>
      <p class="empty" id="loadError" hidden>
        Couldn't load <code>roadmap.json</code>. Serve this folder over HTTP
        (see README) or use <strong>Open…</strong> to pick the file.
      </p>
    </section>

    <section class="note-pane" id="notePane" aria-label="Step notes" hidden>
      <header class="note-head">
        <div class="note-titles">
          <h2 id="noteTitle"></h2>
          <div class="note-crumb" id="noteCrumb"></div>
        </div>
        <div class="note-tools">
          <label class="note-due" title="Target date to finish this step">Target
            <input type="date" id="noteDue">
          </label>
          <button type="button" id="noteEdit">Edit</button>
          <button type="button" id="noteClose" aria-label="Close notes" title="Close">×</button>
        </div>
      </header>
      <div class="note-body">
        <textarea id="noteText" spellcheck="true"
          placeholder="Write notes in Markdown.&#10;Math works like Obsidian: $E = mc^2$ inline, or $$ ... $$ for a block."></textarea>
        <article class="md" id="noteView"></article>
      </div>
    </section>

    <section class="cal-wrap" id="calWrap" aria-label="Time calendar" hidden>
      <div class="cal-head">
        <button type="button" id="calPrev" aria-label="Previous month">‹</button>
        <h2 id="calTitle"></h2>
        <button type="button" id="calNext" aria-label="Next month">›</button>
        <button type="button" id="calToday">Today</button>
        <span class="cal-total" id="calTotal"></span>
      </div>
      <div class="cal-body">
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-day" id="calDay"></div>
      </div>
      <div class="global" id="globalView"></div>
    </section>

    <aside class="next" aria-label="This project">
      <h2>This project</h2>
      <div id="nextList"></div>
    </aside>
  </main>

  <aside class="tank" id="tank" aria-label="Aquarium" hidden>
    <header class="tank-head" id="tankHead">
      <span class="tank-title">Aquarium</span>
      <span class="tank-pearls" title="Pearls: earn them by finishing steps and tracking time"><i class="pearl"></i><b id="tankPearls">0</b></span>
      <button type="button" id="tankMin" title="Minimize">–</button>
      <button type="button" id="tankClose" title="Close">×</button>
    </header>
    <div class="tank-body">
      <div class="tank-view">
        <canvas id="tankCanvas" width="120" height="76"></canvas>
        <div class="tank-shop" id="tankShop" hidden></div>
      </div>
      <div class="tank-bar">
        <button type="button" id="feedBtn">Feed</button>
        <button type="button" id="shopBtn">Shop</button>
      </div>
    </div>
  </aside>

  <div class="modal" id="whatsNew" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="wnTitle">
      <h2 id="wnTitle">What's new</h2>
      <div class="wn-body" id="wnBody"></div>
      <div class="modal-actions"><button type="button" class="primary" id="wnClose">Got it</button></div>
    </div>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="markdown.js"></script>
  <script src="aquarium.js"></script>
  <script src="app.js"></script>
</body>
</html>
